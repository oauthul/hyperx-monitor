name: Rust

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install deps
      run: sudo apt update && sudo apt-get install libudev-dev libgtk-3-dev libxdo-dev libappindicator3-dev
    - name: check package
      run: cargo check
    - name: build binary
      run: cargo build --verbose
